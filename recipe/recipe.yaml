schema_version: 1

context:
  name: libzenohcxx
  version: "1.10.0"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  - url: https://github.com/eclipse-zenoh/zenoh-cpp/archive/refs/tags/${{ version }}.tar.gz
    sha256: c7aed678b421dcce0e3c39fa9ce5dc9bdd92180000beca1e0db9e0c6e78a4f3d
    patches:
      - nowerror.patch

build:
  # See https://github.com/conda-forge/zenoh-c-feedstock/issues/37
  number: 1
  skip: ppc64le

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - ${{ compiler('cxx') }}
    - cmake
    - pkg-config
    - ninja
  host:
    - libzenohc ${{ version }}.*

tests:
  - requirements:
      run:
        - cmake-package-check
        - ${{ compiler('c') }}
        - ${{ compiler('cxx') }}
    script:
      - if: unix
        then: test -f ${PREFIX}/include/zenoh.hxx
      - if: win
        then: if not exist %LIBRARY_PREFIX%\\include\\zenoh.hxx exit 1
      - cmake-package-check zenohc zenohcxx --targets zenohcxx zenohcxx::zenohc

about:
  license: Apache-2.0 OR EPL-2.0
  license_file: LICENSE
  summary: C++ API for zenoh
  homepage: https://github.com/eclipse-zenoh/zenoh-cpp

extra:
  feedstock-name: zenoh-cpp
  recipe-maintainers:
    - traversaro
